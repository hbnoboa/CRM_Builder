# PowerSync configuration for CRM Builder
# This file configures the self-hosted PowerSync service
# to sync data from PostgreSQL to Flutter mobile devices.
#
# Schema ref: https://unpkg.com/@powersync/service-schema@latest/json-schema/powersync-config.json

# PostgreSQL logical replication connection
replication:
  connections:
    - type: postgresql
      uri: !env PS_REPLICATION_URI
      sslmode: disable

# Admin API tokens (for health checks, diagnostics)
api:
  tokens:
    - !env PS_API_TOKEN

# Client authentication (validates Flutter app JWTs using HS256)
# JWT claims: sub/user_id, tenantId, customRoleId, platformAdmin
client_auth:
  audience: ["powersync"]
  jwks:
    keys:
      - kid: crm-builder-key
        kty: oct
        alg: HS256
        k: !env PS_JWT_SECRET_B64

# Storage backend for PowerSync internal state (MongoDB required by v1.19+)
storage:
  type: mongodb
  uri: !env PS_MONGO_URI

# Sync rules: define which data each user can access
# JWT payload: { sub/user_id, tenantId, customRoleId, platformAdmin }
#
# PowerSync supported SQL: =, !=, <, >, AND, OR, NOT, IS NULL, IS NOT NULL
# PowerSync IN operator: works with JSONB arrays (bucket.param IN json_column)
# No JOINs, no GROUP BY, no ORDER BY, no LIMIT, no subqueries
# Each data query must reference ALL bucket parameters
#
# Strategy: permission-driven EntityData buckets (all derived from CustomRole
# permissions via Postgres triggers; see migrations *_visible_roles_*):
# 1. unrestricted_entity_data: records every tenant role can read (_hasRoleFilter=false)
# 2. role_filtered_entity_data: scope='all' — bucket.role_id IN "_visibleToRolesJson"
# 3. own_entity_data: scope='own' — role_id IN "_visibleToRolesOwnJson" AND createdById = user
# 4. admin_all_entity_data: platform admins bypass (gated by platformAdmin claim)
sync_rules:
  content: |
    bucket_definitions:
      # rev: 2026-06-28 own-scope (force re-snapshot for clean op counts)
      # Bucket 1: user-specific data (requires user_id + tenant_id)
      user_data:
        parameters: |
          SELECT
            request.user_id() as user_id,
            request.jwt() ->> 'tenantId' as tenant_id
        data:
          # Current user profile
          - SELECT id, "tenantId", email, name, avatar, "customRoleId", status, "createdAt"
            FROM "User"
            WHERE id = bucket.user_id AND "tenantId" = bucket.tenant_id

          # User's notifications
          - SELECT id, "tenantId", "userId", type, title, message, data, "entitySlug", read, "readAt", "createdAt"
            FROM "Notification"
            WHERE "userId" = bucket.user_id AND "tenantId" = bucket.tenant_id

      # Bucket 2: tenant-level shared data (roles, entities)
      # All users in the same tenant see the same metadata.
      tenant_data:
        parameters: |
          SELECT
            request.jwt() ->> 'tenantId' as tenant_id
        data:
          # Custom roles (for client-side permission checks). roleType removido (Fase 3).
          - SELECT id, "tenantId", name, description, color, "isSystem", permissions, "modulePermissions", "tenantPermissions", "isDefault", "createdAt", "updatedAt"
            FROM "CustomRole"
            WHERE "tenantId" = bucket.tenant_id

          # All entity definitions for tenant
          - SELECT id, "tenantId", name, "namePlural", slug, description, icon, color, category, fields, settings, "isSystem", "createdAt", "updatedAt"
            FROM "Entity"
            WHERE "tenantId" = bucket.tenant_id

          # Entity field rules (dynamic required/visible/default/computed/validation)
          - SELECT id, "tenantId", "entityId", "fieldSlug", "ruleType", condition, config, priority, "isActive", "createdAt", "updatedAt"
            FROM "EntityFieldRule"
            WHERE "tenantId" = bucket.tenant_id AND "isActive" = true

      # Bucket 3: entity data WITHOUT role filters (all tenant users see these)
      # _hasRoleFilter = false means no role has data filters for this entity
      # Also includes ALL ArchivedEntityData (no role filter columns on that table)
      unrestricted_entity_data:
        parameters: |
          SELECT
            request.jwt() ->> 'tenantId' as tenant_id
        data:
          - SELECT id, "tenantId", "entityId", data, "parentRecordId", "createdById", "updatedById", "createdAt", "updatedAt", "deletedAt"
            FROM "EntityData"
            WHERE "tenantId" = bucket.tenant_id
              AND "deletedAt" IS NULL
              AND "_matchesGlobalFilter" = true
              AND "_parentMatchesFilter" = true
              AND "_hasRoleFilter" = false

          # Archived records: no role filter columns, all tenant users see them
          - SELECT id, "tenantId", "entityId", data, "parentRecordId", "createdById", "updatedById", "createdAt", "updatedAt", "archivedAt"
            FROM "ArchivedEntityData"
            WHERE "tenantId" = bucket.tenant_id

      # Bucket 4: entity data WITH role filters (only matching roles see these)
      # Uses PowerSync IN operator on JSONB array column
      # bucket.role_id comes from JWT customRoleId claim
      # _visibleToRolesJson is a JSONB array like ["role-id-1", "role-id-2"]
      # For same-tenant ADMIN roles, their ID is already in the array.
      # For cross-tenant PLATFORM_ADMIN, this returns 0 records (handled by bucket 5).
      role_filtered_entity_data:
        parameters: |
          SELECT
            request.jwt() ->> 'tenantId' as tenant_id,
            request.jwt() ->> 'customRoleId' as role_id
        data:
          - SELECT id, "tenantId", "entityId", data, "parentRecordId", "createdById", "updatedById", "createdAt", "updatedAt", "deletedAt"
            FROM "EntityData"
            WHERE "tenantId" = bucket.tenant_id
              AND "deletedAt" IS NULL
              AND "_matchesGlobalFilter" = true
              AND "_parentMatchesFilter" = true
              AND "_hasRoleFilter" = true
              AND bucket.role_id IN "_visibleToRolesJson"

      # Bucket 4b: own-scope data. The role can read the entity but with
      # permission scope='own', so it only receives records IT created.
      # _visibleToRolesOwnJson holds roles whose scope for the record is 'own'
      # (disjoint from _visibleToRolesJson); createdById must match the user.
      own_entity_data:
        parameters: |
          SELECT
            request.jwt() ->> 'tenantId' as tenant_id,
            request.jwt() ->> 'customRoleId' as role_id,
            request.user_id() as user_id
        data:
          - SELECT id, "tenantId", "entityId", data, "parentRecordId", "createdById", "updatedById", "createdAt", "updatedAt", "deletedAt"
            FROM "EntityData"
            WHERE "tenantId" = bucket.tenant_id
              AND "deletedAt" IS NULL
              AND "_matchesGlobalFilter" = true
              AND "_parentMatchesFilter" = true
              AND "createdById" = bucket.user_id
              AND bucket.role_id IN "_visibleToRolesOwnJson"

      # Bucket 5: platform admins bypass role filters entirely.
      # A platform admin is cross-tenant — their customRoleId belongs to a
      # different tenant, so it's NOT in _visibleToRolesJson. This bucket gives
      # them all role-filtered records of the (overridden) tenant.
      # PowerSync deduplicates if records also match bucket 4.
      # Gated by the platformAdmin claim (replaces the removed roleType claim).
      admin_all_entity_data:
        parameters: |
          SELECT
            request.jwt() ->> 'tenantId' as tenant_id
          WHERE request.jwt() ->> 'platformAdmin' = 'true'
        data:
          - SELECT id, "tenantId", "entityId", data, "parentRecordId", "createdById", "updatedById", "createdAt", "updatedAt", "deletedAt"
            FROM "EntityData"
            WHERE "tenantId" = bucket.tenant_id
              AND "deletedAt" IS NULL
              AND "_matchesGlobalFilter" = true
              AND "_parentMatchesFilter" = true
              AND "_hasRoleFilter" = true

