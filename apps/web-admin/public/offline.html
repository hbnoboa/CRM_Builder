<!doctype html>
<html lang="pt-BR">
<head>
  <meta charset="utf-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1" />
  <title>Sem conexão</title>
  <style>
    :root { color-scheme: light dark; }
    body { margin: 0; min-height: 100vh; display: flex; align-items: center; justify-content: center;
      font-family: system-ui, -apple-system, "Segoe UI", Roboto, sans-serif; background: #f8fafc; color: #0f172a; }
    @media (prefers-color-scheme: dark) { body { background: #0b1120; color: #e2e8f0; } p { color: #94a3b8 !important; } }
    main { max-width: 22rem; padding: 2rem 1.5rem; text-align: center; }
    h1 { font-size: 1.25rem; margin: 0 0 .5rem; }
    p { margin: 0 0 1.5rem; color: #475569; line-height: 1.5; }
    button { font: inherit; padding: .65rem 1.25rem; border: 0; border-radius: .5rem; background: #0f172a; color: #fff; cursor: pointer; }
    @media (prefers-color-scheme: dark) { button { background: #e2e8f0; color: #0f172a; } }
  </style>
</head>
<body>
  <main>
    <h1>Sem conexão com a internet</h1>
    <p>O sistema precisa de internet para mostrar e salvar os dados. Confira o Wi-Fi ou os dados móveis e tente de novo.</p>
    <button type="button" onclick="location.reload()">Tentar de novo</button>
  </main>
</body>
</html>
