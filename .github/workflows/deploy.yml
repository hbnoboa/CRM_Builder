name: Deploy

# Build no runner do GitHub (cache) -> push na Google Artifact Registry ->
# deploy na VM via `gcloud compute ssh` (auth keyless por Workload Identity Federation).
# SEM secret, SEM runner self-hosted.
#
# GATILHO POR BRANCH (modelo SegAqui):
#   - push em `develop`            -> deploy DEV automatico (iteracao rapida)
#   - workflow_dispatch env=prod   -> deploy PROD MANUAL, SO a partir da branch `main`
#                                     (o job setup barra se rodar de outra ref). Prod nunca sobe sozinho.
#   - workflow_dispatch env=dev    -> deploy DEV manual avulso (de qualquer ref)
#
# Imagens: tag `:<env>` (movel, o compose referencia) + `:<env>-<sha>` (imutavel, rollback).
# Gate opcional por cima: environment `prod` com required reviewer (Settings > Environments).

run-name: 🚀 Deploy → ${{ (github.event_name == 'workflow_dispatch' && inputs.environment == 'prod') && 'PROD' || 'DEV' }} · ${{ github.ref_name }} · por ${{ github.actor }}

on:
  push:
    branches: [develop]
  workflow_dispatch:
    inputs:
      environment:
        description: Ambiente alvo (prod so roda a partir da branch main)
        type: choice
        options: [dev, prod]
        default: dev

permissions:
  contents: read
  id-token: write   # WIF (OIDC)

# Um deploy por ambiente de cada vez; NAO cancela (deploy nao deve ser interrompido).
concurrency:
  group: deploy-${{ inputs.environment || 'dev' }}
  cancel-in-progress: false

env:
  GAR_HOST: us-central1-docker.pkg.dev
  GCP_PROJECT: ios-forms-299fb
  GAR_REPO: crm
  WIF_PROVIDER: projects/35661851099/locations/global/workloadIdentityPools/github/providers/github-provider
  WIF_SA: crm-ci@ios-forms-299fb.iam.gserviceaccount.com
  VM_NAME: ios-vm
  VM_ZONE: us-central1-f
  VM_USER: hbnoboa11
  VM_DIR: /home/hbnoboa11/crm-builder

jobs:
  # ---- resolve o ambiente + guard: PROD so a partir da main ---------------
  setup:
    runs-on: ubuntu-latest
    outputs:
      env: ${{ steps.pick.outputs.env }}
    steps:
      - id: pick
        run: |
          set -euo pipefail
          if [ "${{ github.event_name }}" = "workflow_dispatch" ]; then
            ENV="${{ inputs.environment }}"
          else
            ENV="dev"
          fi
          if [ "$ENV" = "prod" ] && [ "${{ github.ref }}" != "refs/heads/main" ]; then
            echo "::error title=Branch errada pra PROD::Deploy de PROD so roda a partir da branch 'main' (ref atual: ${{ github.ref }})."
            exit 1
          fi
          echo "env=$ENV" >> "$GITHUB_OUTPUT"
          echo "Ambiente alvo: $ENV (event=${{ github.event_name }}, ref=${{ github.ref }})"

  # ---- build + push das imagens na GAR ------------------------------------
  build:
    name: Build & Push (${{ needs.setup.outputs.env }})
    needs: setup
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: pnpm/action-setup@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '20'
          cache: 'pnpm'
      - run: pnpm install --frozen-lockfile
      - run: cd apps/api && pnpm prisma generate
      - name: Build (shared -> api + web)
        run: pnpm build
        env:
          NEXT_PUBLIC_API_URL: /api/v1

      - uses: google-github-actions/auth@v2
        with:
          workload_identity_provider: ${{ env.WIF_PROVIDER }}
          service_account: ${{ env.WIF_SA }}
      - uses: google-github-actions/setup-gcloud@v2
      - run: gcloud auth configure-docker ${{ env.GAR_HOST }} --quiet
      - uses: docker/setup-buildx-action@v3

      - name: Build & push API
        uses: docker/build-push-action@v6
        with:
          context: .
          file: apps/api/Dockerfile
          push: true
          tags: |
            ${{ env.GAR_HOST }}/${{ env.GCP_PROJECT }}/${{ env.GAR_REPO }}/crm-builder-api:${{ needs.setup.outputs.env }}
            ${{ env.GAR_HOST }}/${{ env.GCP_PROJECT }}/${{ env.GAR_REPO }}/crm-builder-api:${{ needs.setup.outputs.env }}-${{ github.sha }}
          cache-from: type=gha,scope=api
          cache-to: type=gha,mode=max,scope=api

      - name: Build & push Web
        uses: docker/build-push-action@v6
        with:
          context: .
          file: apps/web-admin/Dockerfile
          build-args: |
            NEXT_PUBLIC_API_URL=/api/v1
          push: true
          tags: |
            ${{ env.GAR_HOST }}/${{ env.GCP_PROJECT }}/${{ env.GAR_REPO }}/crm-builder-web:${{ needs.setup.outputs.env }}
            ${{ env.GAR_HOST }}/${{ env.GCP_PROJECT }}/${{ env.GAR_REPO }}/crm-builder-web:${{ needs.setup.outputs.env }}-${{ github.sha }}
          cache-from: type=gha,scope=web
          cache-to: type=gha,mode=max,scope=web

  # ---- deploy na VM (gated por environment; prod pode exigir aprovacao) ----
  deploy:
    name: Deploy (${{ needs.setup.outputs.env }})
    needs: [setup, build]
    runs-on: ubuntu-latest
    environment: ${{ needs.setup.outputs.env }}
    steps:
      - uses: google-github-actions/auth@v2
        with:
          workload_identity_provider: ${{ env.WIF_PROVIDER }}
          service_account: ${{ env.WIF_SA }}
      - uses: google-github-actions/setup-gcloud@v2

      - name: Deploy na VM (gcloud ssh)
        env:
          ENV_NAME: ${{ needs.setup.outputs.env }}
          REF: ${{ github.ref_name }}
        run: |
          gcloud compute ssh "${VM_USER}@${VM_NAME}" \
            --zone "${VM_ZONE}" --project "${GCP_PROJECT}" --quiet \
            --ssh-flag="-o StrictHostKeyChecking=no" \
            --command "cd '${VM_DIR}' && git fetch --quiet origin '${REF}' && git reset --hard --quiet 'origin/${REF}' && ENV_NAME='${ENV_NAME}' bash scripts/vm-deploy.sh"
